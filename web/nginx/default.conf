# Two sites from one image (docs/ARCHITECTURE.md §8.11): the diary on 8080 and the mantra site on 8082. Each
# serves its own build; both forward /api to the same server. Caddy maps each hostname to its port.

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/app.conf;
}

server {
    listen 8082;
    server_tokens off;
    root /usr/share/nginx/mantra;
    include /etc/nginx/snippets/app.conf;
}
